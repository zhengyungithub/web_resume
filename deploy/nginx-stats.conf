# ─────────────────────────────────────────────────────────────
# stats.zhengyun.online —— 访问数据看板
#
# 部署：
#   scp deploy/nginx-stats.conf ubuntu@43.142.33.191:/tmp/
#   sudo cp /tmp/nginx-stats.conf /etc/nginx/sites-available/stats.zhengyun.online
#   sudo ln -sf /etc/nginx/sites-available/stats.zhengyun.online /etc/nginx/sites-enabled/
#   sudo certbot certonly --webroot -w /var/www/certbot -d stats.zhengyun.online
#   sudo nginx -t && sudo systemctl reload nginx
#
# 说明：
# - root 与主站共用 dist，但只对外暴露 stats.html（try_files 兜底），
#   所以无法通过子域名访问到主站的 index.html 或其他文件。
# - access_log 与主站共用一个独立日志文件：看板只统计真实访客，
#   同服务器的其他项目（campus / zhitu）走各自的 server 块，不进这个文件。
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name stats.zhengyun.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stats.zhengyun.online;

    ssl_certificate     /etc/letsencrypt/live/stats.zhengyun.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.zhengyun.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root  /var/www/zhengyun/app/dist;
    index stats.html;

    # 只看板本身的访问也记进同一个日志，便于统计
    access_log /var/log/nginx/zhengyun.access.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 看板 HTML 不缓存，避免发版后看到旧页面
    location = /stats.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 任何非 API、非资源的路径都回到看板（不暴露主站页面）
    location / {
        try_files /stats.html =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

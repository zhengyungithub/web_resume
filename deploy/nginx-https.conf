# ─────────────────────────────────────────────────────────────
# 第二阶段配置：HTTPS 正式版
#
# 使用前提：证书已经签发成功
#   certbot certonly --webroot -w /var/www/certbot \
#     -d zhengyun.online -d www.zhengyun.online
#
# 切换：
#   cp deploy/nginx-https.conf /etc/nginx/sites-available/zhengyun.online
#   nginx -t && systemctl reload nginx
#
# 注意：这里用 `listen 443 ssl http2`（老语法），Ubuntu 仓库里的
#       nginx 1.18 / 1.24 都支持；`http2 on;` 要 1.25.1+，不能用。
# ─────────────────────────────────────────────────────────────

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name zhengyun.online www.zhengyun.online;

    # 保留 certbot 续期的 webroot 校验通道
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.zhengyun.online$request_uri;
    }
}

# 裸域 → www（统一主域，避免重复收录）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zhengyun.online;

    ssl_certificate     /etc/letsencrypt/live/zhengyun.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhengyun.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    return 301 https://www.zhengyun.online$request_uri;
}

# 主站
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zhengyun.online;

    ssl_certificate     /etc/letsencrypt/live/zhengyun.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhengyun.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/zhengyun/app/dist;
    index index.html;

    # ── 压缩 ───────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ── 带 hash 的构建产物：一年强缓存 ──────────────────────
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── index.html 不缓存，保证发版后立刻生效 ───────────────
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── API 反代 ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # 大模型润色最长等 20s，留出余量
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── SPA 兜底 ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件不对外
    location ~ /\.(?!well-known) {
        deny all;
    }
}

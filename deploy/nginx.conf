# ─────────────────────────────────────────────────────────────
# 第一阶段配置：纯 HTTP（bootstrap.sh 安装这一份）
#
# 为什么不直接上 HTTPS：
#   首次部署时 /etc/letsencrypt/live/ 下还没有证书，如果配置里写了
#   ssl_certificate，`nginx -t` 会报 "cannot load certificate"，
#   而 certbot 又必须靠 nginx 响应 ACME 校验才能签发 —— 死锁。
#   所以先跑 HTTP，签完证书再换成 nginx-https.conf。
#
# 备案期间可以用 http://服务器IP/ 直接访问验证（Nginx 会把它当
# 默认 server），不需要对外放行 3000 端口。
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name zhengyun.online www.zhengyun.online;

    # certbot webroot 校验通道
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /var/www/zhengyun/app/dist;
    index index.html;

    # ── 压缩 ───────────────────────────────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # ── 带 hash 的构建产物：一年强缓存 ──────────────────────
    # 只用 add_header，不叠加 expires，避免下发两条 Cache-Control
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── index.html 不缓存，保证发版后立刻生效 ───────────────
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── API 反代 ───────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # 大模型润色最长等 20s，留出余量
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── SPA 兜底 ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件不对外
    location ~ /\.(?!well-known) {
        deny all;
    }
}
